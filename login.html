<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar · Admin Radio Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <header class="topbar">
    <span class="on-air">
      <span class="on-air__dot" aria-hidden="true"></span>
      PANEL ADMIN
    </span>
  </header>

  <div class="auth-shell">
    <div class="form-panel">
      <h1>Ingresar</h1>
      <p class="form-panel__sub">Acceso exclusivo para administradores.</p>

      <form id="form-login">
        <div class="field">
          <label for="input-email">Email</label>
          <input type="email" id="input-email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="input-pass">Contraseña</label>
          <input type="password" id="input-pass" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn--full" id="btn-login">Ingresar</button>
        <p id="status" class="status-msg"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script>
    const status = document.getElementById("status");
    const btnLogin = document.getElementById("btn-login");

    function setStatus(msg, state) {
      status.textContent = msg;
      status.dataset.state = state || "";
    }

    // Si ya hay una sesión activa, saltear directo al panel.
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = "admin.html";
    });

    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      btnLogin.disabled = true;
      setStatus("Ingresando…", "loading");

      const email = document.getElementById("input-email").value.trim();
      const password = document.getElementById("input-pass").value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        setStatus("Email o contraseña incorrectos.", "error");
        btnLogin.disabled = false;
        return;
      }

      window.location.href = "admin.html";
    });
  </script>
</body>
</html>
